<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegates</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23262628'/%3E%3Cpolyline points='8,34 20,34 26,18 36,48 42,30 48,34 56,34' fill='none' stroke='%2352d6a0' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1c1c1e; --surface:#262628; --ink:#e8e8ea; --muted:#9a9a9f; --line:#38383b;
  --ok:#52d6a0; --ok-bg:#1f3a30; --bad:#ff8f80; --bad-bg:#412522;
  --accent:#8ab4f8; --flash:#2f6ea3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:24px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.status{display:grid;grid-template-columns:auto minmax(0,auto);justify-content:center;align-items:center;column-gap:8px;row-gap:6px;text-align:left;max-width:100%}
.live{display:contents;font-size:14px;color:var(--muted)}
.live span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.live.ok .dot{background:var(--ok);animation:pulse 2s infinite}
.live.err .dot{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent;opacity:.6}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:11px 16px;text-align:left;white-space:nowrap}
th{font-weight:600;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th[aria-sort=ascending]::after{content:" ▲";font-size:10px}
th[aria-sort=descending]::after{content:" ▼";font-size:10px}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.04)}
td.flash{animation:flash 2.4s ease-out}
@keyframes flash{from{background:var(--flash)}}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.msg{padding:28px 20px;text-align:center;color:var(--muted)}
.msg.error{color:var(--bad)}
footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}
.prices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:20px}
.prices:empty{display:none}
.price{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;min-width:120px}
.price .n{color:var(--muted);font-size:12px}
.price .v{font-weight:600;font-variant-numeric:tabular-nums}
.price .c{font-size:12px;font-variant-numeric:tabular-nums}
.price .c.up{color:var(--ok)}
.price .c.down{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:640px){
  main{padding:18px 12px 32px}
  header{margin-bottom:14px}
  h1{font-size:24px}
  .prices{gap:8px;margin-bottom:14px}
  .price{flex:1 1 30%;min-width:0;padding:8px 10px}
  .wrap{background:none;border:0;border-radius:0;overflow:visible}
  table,tbody,tr,td{display:block;width:100%;min-width:0}
  thead{display:none}
  /* card: title row (network, delegate, state), then a row of small stats */
  tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:15px 16px}
  tr::before{content:"";order:4;flex:0 0 100%;height:0}
  td{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:auto;min-width:0;overflow:hidden;border:0;padding:0;white-space:nowrap;text-align:left}
  td::before{content:attr(data-label);color:var(--muted);font-size:12px;line-height:1.2}
  td:nth-child(1),td:nth-child(2),td:nth-child(6){flex-direction:row;align-items:center}
  td:nth-child(1)::before,td:nth-child(2)::before,td:nth-child(6)::before{display:none}
  /* network: fixed width (fits a name like "monolythium", about 102px) so every delegate name starts at the same x; longer names get an ellipsis */
  td:nth-child(1){order:1;flex:0 0 7em;display:block;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:600;font-size:16px}
  td:nth-child(2){order:2;flex:1 1 0;min-width:0;display:block;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:17px}
  td:nth-child(6){order:3;flex:0 0 auto}
  /* fixed proportions so the stat columns line up from card to card (100% minus the three 8px gaps) */
  td:nth-child(3){order:5;flex:0 0 calc((100% - 24px) * .14)}
  td:nth-child(4){order:6;flex:0 0 calc((100% - 24px) * .21)}
  td:nth-child(7){order:7;flex:0 0 calc((100% - 24px) * .19)}
  td:nth-child(5){order:8;flex:0 0 calc((100% - 24px) * .46)}
  tbody tr:hover{background:var(--surface)}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Delegate Dashboard</h1>
    <div class="status">
      <div class="live" id="pageLive" role="status" aria-live="polite"><span class="dot"></span><span id="pageText">Loading…</span></div>
      <div class="live" id="dataLive" role="status" aria-live="polite"><span class="dot"></span><span id="dataText">Loading…</span></div>
    </div>
  </header>

  <div class="prices" id="prices" aria-label="Prices in USD"></div>

  <div class="wrap" id="wrap"><div class="msg">Loading status.json…</div></div>
  <footer>*Yield: productivity calculated over the last 100 rounds.<br><span id="credit"></span></footer>
</main>

<script src="local.js"></script> <!-- optional, git-ignored: see local.example.js -->
<script>
const STATUS_URL = 'status.json';   // written by delcheck.py, relative to this page
const REFRESH_MS = 30000;        // refresh every 30 seconds
const FETCH_TIMEOUT_MS = 10000;  // treat the server as unreachable after this long
const TICK_MS = 15000;           // update the "X ago" text and the stale check every 15 seconds
const STALE_SECS = 180;          // warn when the backend hasn't written new data for this long
const PRICE_REFRESH_MS = 300000; // refresh prices every 5 minutes
/* Optional settings from web/local.js (see local.example.js). With nothing set, prices come from keyless CoinGecko. */
const CG_API_KEY  = window.CG_API_KEY  || '';   // CoinGecko Demo key
const LCW_API_KEY = window.LCW_API_KEY || '';   // LiveCoinWatch key
const PRICE_SYMBOLS = window.PRICE_SYMBOLS || {}; // LiveCoinWatch ticker overrides, e.g. {monolythium: 'LYTH'}
let priceIds = [], prices = {}, lastPriceFetch = 0, priceTimer = null;
const $ = id => document.getElementById(id);

let rows = [], prev = new Map();
let sortCol = -1, sortDir = 1;
let updatedAt = null, lastOk = null, fetchErr = null, inflight = false;

/* "1 minute ago" / "5 minutes ago" / "3 hours ago" / "2 days ago", computed from a unix timestamp */
function agoText(ts){
  const mins = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
  let n = mins, unit = 'minute';
  if (mins >= 1440){ n = Math.floor(mins / 1440); unit = 'day'; }
  else if (mins >= 60){ n = Math.floor(mins / 60); unit = 'hour'; }
  return n + ' ' + unit + (n === 1 ? '' : 's') + ' ago';
}

/* Columns: val = raw value, key = sort key (defaults to val), fmt = display text */
const COLS = [
  {label:'Network',    val: r => r.network},
  {label:'Delegate',   val: r => r.delegate},
  {label:'Rank',       val: r => r.rank},
  {label:'Forging',    val: r => r.forging == null ? null : (r.forging ? 'yes' : 'no')},
  {label:'Last Block', val: r => r.last_block, key: r => r.last_block == null ? null : -r.last_block, fmt: agoText, age: true},
  {label:'State',      val: r => r.state},
  {label:'Yield',      val: r => r['yield'], fmt: v => v + '%'}
];

const GOOD = new Set(['yes','healthy','true','ok','online','active','synced','up']);
const BAD  = new Set(['no','unhealthy','false','offline','down','missing','error','stopped','failed','out']);
function kind(v){
  const s = v.trim().toLowerCase();
  return GOOD.has(s) ? 'ok' : BAD.has(s) ? 'bad' : '';
}

async function load(){
  if (inflight) return;
  inflight = true;
  try{
    const res = await fetch(STATUS_URL + '?t=' + Date.now(), {cache:'no-store', signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.delegates) || typeof data.updated_at !== 'number') throw new Error('Unexpected file format');
    rows = data.delegates;
    updatedAt = data.updated_at;
    lastOk = new Date();
    fetchErr = null;
    refreshLive();
    render();
    if (!priceTimer){ priceTimer = setInterval(loadPrices, PRICE_REFRESH_MS); loadPrices(); }
  } catch (e){
    fetchErr = e.message;
    refreshLive();
    if (!rows.length){
      $('wrap').innerHTML = '';
      const m = document.createElement('div');
      m.className = 'msg error';
      m.textContent = 'Could not load ' + STATUS_URL + ' (' + e.message + '). Serve this page from a web server next to the JSON file; browsers block file:// reads.';
      $('wrap').append(m);
    }
  } finally { inflight = false; }
}

function setLive(prefix, state, text, title){
  $(prefix + 'Live').className = 'live ' + state;
  const el = $(prefix + 'Text');
  if (el.textContent !== text) el.textContent = text;
  el.title = title || '';
}

/* Two status lines: can the page reach the server, and is the backend still writing data */
function refreshLive(){
  if (fetchErr) setLive('page', 'err', 'Update failed' + (lastOk ? ' · last update ' + lastOk.toLocaleTimeString() : ''), fetchErr);
  else if (lastOk) setLive('page', 'ok', 'Page updated ' + lastOk.toLocaleTimeString());

  if (updatedAt == null) return;
  if (Date.now() / 1000 - updatedAt > STALE_SECS) setLive('data', 'err', 'Stale data: last run ' + agoText(updatedAt));
  else setLive('data', 'ok', 'Data updated ' + new Date(updatedAt * 1000).toLocaleTimeString());
}

function tick(){
  document.querySelectorAll('td[data-ts]').forEach(td => { td.textContent = agoText(+td.dataset.ts); });
  refreshLive();
}

function render(){
  let view = rows.slice();
  if (sortCol >= 0){
    const col = COLS[sortCol];
    const key = r => col.key ? col.key(r) : col.val(r);
    view.sort((a,b) => {
      const x = key(a), y = key(b);
      if (x == null || y == null) return (x == null) - (y == null);   // empty values always last
      const cmp = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, {numeric:true});
      return cmp * sortDir;
    });
  }

  const table = document.createElement('table');
  const trh = table.createTHead().insertRow();
  COLS.forEach((c, j) => {
    const th = document.createElement('th');
    th.textContent = c.label; th.tabIndex = 0;
    th.setAttribute('aria-sort', j === sortCol ? (sortDir > 0 ? 'ascending' : 'descending') : 'none');
    const go = () => { sortDir = (sortCol === j) ? -sortDir : 1; sortCol = j; render(); };
    th.onclick = go;
    th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
    trh.append(th);
  });

  const tb = table.createTBody();
  view.forEach(r => {
    const tr = tb.insertRow();
    COLS.forEach((c, j) => {
      const raw = c.val(r), td = tr.insertCell();
      const v = raw == null ? '-' : (c.fmt ? c.fmt(raw) : String(raw)), k = kind(v);
      td.dataset.label = c.label;
      if (c.age && raw != null) td.dataset.ts = raw;
      if (k){
        const b = document.createElement('span');
        b.className = 'badge ' + k; b.textContent = v; td.append(b);
      } else td.textContent = v;
      const id = r.network + '|' + r.delegate + '|' + j;
      if (prev.size && prev.has(id) && prev.get(id) !== String(raw)) td.classList.add('flash');
    });
  });
  prev = new Map();
  rows.forEach(r => COLS.forEach((c, j) => prev.set(r.network + '|' + r.delegate + '|' + j, String(c.val(r)))));

  $('wrap').innerHTML = '';
  if (view.length) $('wrap').append(table);
  else { const m = document.createElement('div'); m.className = 'msg'; m.textContent = 'No delegates found in ' + STATUS_URL + '.'; $('wrap').append(m); }
}

/* Prices: BTC plus every distinct network name. Each provider turns a list of ids (lowercased network
   names, "bitcoin") into {id: {usd, change}}, where change is the 24h change in percent. */
const LCW_DEFAULT_SYMBOLS = {bitcoin: 'BTC'};   // ids that aren't just their uppercased name; extend via PRICE_SYMBOLS

const PROVIDERS = {
  coingecko: {
    name: 'CoinGecko', url: 'https://www.coingecko.com',
    async fetch(ids){
      const url = 'https://api.coingecko.com/api/v3/simple/price?vs_currencies=usd&include_24hr_change=true&ids=' +
        encodeURIComponent(ids.join(','));
      const res = await fetch(url, {
        headers: CG_API_KEY ? {'x-cg-demo-api-key': CG_API_KEY} : undefined,
        signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json(), out = {};
      ids.forEach(id => {
        const p = data[id];
        if (p && typeof p.usd === 'number') out[id] = {usd: p.usd, change: typeof p.usd_24h_change === 'number' ? p.usd_24h_change : null};
      });
      return out;
    }
  },
  livecoinwatch: {
    name: 'LiveCoinWatch', url: 'https://www.livecoinwatch.com',
    async fetch(ids){
      const sym = id => (PRICE_SYMBOLS[id] || LCW_DEFAULT_SYMBOLS[id] || id.replace(/-/g, '')).toUpperCase();
      const res = await fetch('https://api.livecoinwatch.com/coins/map', {
        method: 'POST',
        headers: {'content-type': 'application/json', 'x-api-key': LCW_API_KEY},
        body: JSON.stringify({currency: 'USD', codes: ids.map(sym), sort: 'rank', order: 'ascending', offset: 0, limit: 0, meta: false}),
        signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json(), out = {};
      ids.forEach(id => {
        const p = Array.isArray(data) && data.find(x => x.code === sym(id));
        if (p && typeof p.rate === 'number') out[id] = {usd: p.rate, change: p.delta && typeof p.delta.day === 'number' ? (p.delta.day - 1) * 100 : null};
      });
      return out;
    }
  }
};

/* window.PRICE_PROVIDER ('coingecko' | 'livecoinwatch') wins; otherwise a LiveCoinWatch key selects LiveCoinWatch,
   and anything else (a CoinGecko key, or no key at all) uses CoinGecko. LiveCoinWatch always needs its key. */
function pickProvider(){
  const want = String(window.PRICE_PROVIDER || '').toLowerCase();
  if (want === 'coingecko') return 'coingecko';
  if (want === 'livecoinwatch' || !want) return LCW_API_KEY ? 'livecoinwatch' : 'coingecko';
  return 'coingecko';
}
const PROVIDER = PROVIDERS[pickProvider()];
{
  const a = document.createElement('a');
  a.href = PROVIDER.url; a.textContent = PROVIDER.name; a.style.color = 'inherit';
  $('credit').append('Prices by ', a);
}

async function loadPrices(){
  if (document.hidden) return;   // don't spend API calls on a background tab; the visibility handler catches up
  const ids = new Set(['bitcoin']);
  rows.forEach(r => {
    const id = (r.network || '').trim().toLowerCase().replace(/\s+/g, '-');
    if (id) ids.add(id);
  });
  priceIds = [...ids];
  try{
    prices = await PROVIDER.fetch(priceIds);
    lastPriceFetch = Date.now();
  } catch (e){ /* keep showing the last prices, if any */ }
  renderPrices();
}

function renderPrices(){
  const box = $('prices'); box.innerHTML = '';
  const fmt = n => new Intl.NumberFormat('en-US', {style:'currency', currency:'USD', maximumFractionDigits: n < 1 ? 6 : 2}).format(n);
  priceIds.forEach(id => {
    const p = prices[id];
    if (!p) return;   // not listed by the provider: skip
    const card = document.createElement('div'); card.className = 'price';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = id.charAt(0).toUpperCase() + id.slice(1);
    const v = document.createElement('div'); v.className = 'v'; v.textContent = fmt(p.usd);
    card.append(n, v);
    if (typeof p.change === 'number'){
      const c = document.createElement('div');
      c.className = 'c ' + (p.change >= 0 ? 'up' : 'down');
      c.textContent = (p.change >= 0 ? '▲ ' : '▼ ') + Math.abs(p.change).toFixed(2) + '%';
      card.append(c);
    }
    box.append(card);
  });
}

setInterval(load, REFRESH_MS);
setInterval(tick, TICK_MS);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  load();
  tick();
  if (priceTimer && Date.now() - lastPriceFetch > PRICE_REFRESH_MS) loadPrices();
});
load();
</script>
</body>
</html>
